<!doctype html>
<!--
  Source for the original ambient hero loop (public/media/hero-loop.webm + hero-poster.jpg).
  Rendered frame-by-frame by scripts/render-hero-loop.mjs. draw(t) is deterministic and
  periodic over LOOP seconds, so the encoded video loops seamlessly.
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#07070a;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>
const W = innerWidth, H = innerHeight, LOOP = 12
const c = document.getElementById('c'); c.width = W; c.height = H
const g = c.getContext('2d')
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647

// Routes: long, shallow curves that sweep across the frame like lanes of traffic.
const routes = Array.from({ length: 18 }, (_, i) => {
  const y0 = H * (0.18 + 0.72 * rnd()), y1 = H * (0.1 + 0.85 * rnd())
  return { p: [[-W * 0.1, y0], [W * (0.25 + 0.2 * rnd()), y0 + (rnd() - 0.5) * H * 0.5],
                [W * (0.55 + 0.2 * rnd()), y1 + (rnd() - 0.5) * H * 0.5], [W * 1.1, y1]],
           speed: 1 + Math.floor(rnd() * 2), packets: 2 + Math.floor(rnd() * 3), off: rnd(), accent: i % 5 === 1 }
})
const bez = (p, t) => { const u = 1 - t
  return [u*u*u*p[0][0] + 3*u*u*t*p[1][0] + 3*u*t*t*p[2][0] + t*t*t*p[3][0],
          u*u*u*p[0][1] + 3*u*u*t*p[1][1] + 3*u*t*t*p[2][1] + t*t*t*p[3][1]] }

function draw(t) {
  const ph = (t % LOOP) / LOOP
  g.globalCompositeOperation = 'source-over'
  g.fillStyle = '#07070a'; g.fillRect(0, 0, W, H)
  const glow = g.createRadialGradient(W * 0.78, H * 0.62, 0, W * 0.78, H * 0.62, W * 0.6)
  glow.addColorStop(0, `rgba(255,77,28,${0.16 + 0.03 * Math.sin(ph * Math.PI * 2)})`); glow.addColorStop(1, 'rgba(255,77,28,0)')
  g.fillStyle = glow; g.fillRect(0, 0, W, H)

  // faint lanes
  g.lineWidth = 1
  for (const r of routes) { g.strokeStyle = r.accent ? 'rgba(255,120,80,0.10)' : 'rgba(242,239,233,0.05)'
    g.beginPath(); g.moveTo(...r.p[0]); g.bezierCurveTo(...r.p[1], ...r.p[2], ...r.p[3]); g.stroke() }

  // packets: continuous light streaks that fade towards the tail
  g.globalCompositeOperation = 'lighter'
  g.lineCap = 'round'
  for (const r of routes) for (let k = 0; k < r.packets; k++) {
    const head = (r.off + k / r.packets + ph * r.speed) % 1
    const col = r.accent ? '255,96,48' : '242,239,233'
    const len = r.accent ? 0.22 : 0.16, steps = 40
    let prev = bez(r.p, Math.max(0, head - len))
    for (let s = 1; s <= steps; s++) {
      const a = head - len + (len * s) / steps; if (a < 0) continue
      const pt = bez(r.p, a), f = s / steps
      g.strokeStyle = `rgba(${col},${f ** 2.2 * (r.accent ? 0.95 : 0.5)})`
      g.lineWidth = 0.6 + f * (r.accent ? 1.8 : 1.2)
      g.beginPath(); g.moveTo(...prev); g.lineTo(...pt); g.stroke(); prev = pt
    }
    const [hx, hy] = prev
    const halo = g.createRadialGradient(hx, hy, 0, hx, hy, r.accent ? 10 : 6)
    halo.addColorStop(0, `rgba(${col},${r.accent ? 0.8 : 0.45})`); halo.addColorStop(1, `rgba(${col},0)`)
    g.fillStyle = halo; g.fillRect(hx - 10, hy - 10, 20, 20)
  }

  // grid ticks — a quiet engineering texture
  g.globalCompositeOperation = 'source-over'
  g.fillStyle = 'rgba(242,239,233,0.10)'
  for (let x = 48; x < W; x += 96) for (let y = 48; y < H; y += 96) g.fillRect(x, y, 1, 1)

  // vignette (grain is added in CSS so it doesn't inflate the video bitrate)
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75)
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)')
  g.fillStyle = v; g.fillRect(0, 0, W, H)
}
window.draw = draw
window.LOOP = LOOP
draw(0)
</script></body></html>
